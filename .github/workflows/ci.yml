name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev ffmpeg
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_boundaries.py
      - run: cargo fmt --all --check
      # The standalone CUDA helper needs the pinned native runtime and a
      # separate hardware checkpoint; --all-features would enable it here.
      - run: cargo check --workspace --all-targets --features fold-app/desktop --locked
      # ImGui tests share process-global state and must run serially.
      - run: cargo test --workspace --features fold-app/desktop --locked -- --test-threads=1
      - run: cargo run -p fold-app --bin fold-cli --no-default-features --locked
      - run: cargo build -p fold-app --bin fold-desktop --features desktop --locked
