[package]
name = "fold-rewrite-dependency-probe"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "fold-rewrite-dependency-probe"

[workspace]

[dependencies]
bevy_ecs = { version = "=0.18.1", default-features = false, features = ["std"] }
bevy_render = { version = "=0.18.1", default-features = false }
parley = { version = "=0.7.0", default-features = false, features = ["std"] }
vello = { version = "=0.7.0", default-features = false, features = ["wgpu"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "=0.4.0"

bevy = { version = "=0.18.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_log"] }
half = "2"
