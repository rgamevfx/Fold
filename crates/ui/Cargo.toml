[package]
name = "fold-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Opt-in baseline instrumentation; absent from normal desktop builds.
native-probe = []

[dependencies]
fold-media.workspace = true
fold-project.workspace = true
fold-animation.workspace = true
serde_json.workspace = true
serde.workspace = true
fold-foundation.workspace = true
fold-platform = { workspace = true, features = ["gpu"] }
dear-imgui-rs = "0.18"
dear-node-editor = "0.18"
dear-imgui-winit = "0.18"
dear-imgui-wgpu = { version = "0.18", default-features = false, features = ["wgpu-27"] }
winit = "0.30"
pollster = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
url = "2"

# FFI is confined to the Wayland display adapter; all other UI code stays denied.
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
tempfile.workspace = true
