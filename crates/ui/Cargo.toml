[package]
name = "fold-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Opt-in baseline instrumentation; absent from normal desktop builds.
native-probe = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
fold-foundation.workspace = true
fold-platform.workspace = true
dear-imgui-rs = "0.18"
dear-node-editor = "0.18"
dear-imgui-winit = "0.18"
dear-imgui-wgpu = { version = "0.18", default-features = false, features = ["wgpu-27"] }
winit = "0.30"
pollster = "0.4"

[lints]
workspace = true
