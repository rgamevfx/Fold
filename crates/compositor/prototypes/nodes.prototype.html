<!doctype html>
<!-- Static compositing panel review. Only notes, navigation and disclosure sections are functional.
Reference baseline: https://learn.foundry.com/nuke/content/reference_guide.html
Read, Write and Blur remain proposals. Static control values are illustrative.
Grade, Shuffle and Transform have separate approved studies. Tracker is excluded. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fold · Node panels</title>
<style>

0 6px;font:11px Arial,sans-serif;gap:4px}.menu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.menu:after{content:'⌄';color:#9999a2;flex-shrink:0}.text{justify-content:flex-start;padding:0 6px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font:11px Arial,sans-serif}.muted{color:#808089}.affordance{color:#8e8e95;text-align:center;font-size:14px}.inline{display:flex;gap:6px;align-items:center;min-width:0}.inline>.control{flex:1;min-width:0}.pair,.triple,.quad{display:grid;gap:3px;min-width:0}.pair{grid-template-columns:repeat(2,minmax(0,1fr))}.triple{grid-template-columns:repeat(3,minmax(0,1fr))}.quad{grid-template-columns:repeat(4,minmax(0,1fr))}.component{position:absolute;left:4px;top:7px;font:9px Arial,sans-serif;color:#94949c}.component.r{color:#c58787}.component.g{color:#89b394}.component.b{color:#899dc4}.pair .control,.triple .control,.quad .control{padding-left:10px;font-size:10px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;color:#a4a4ad;font-size:11px}.check{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font:11px Arial,sans-serif}.box{width:11px;height:11px;border:1px solid #73737c;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:10px;background:#333338;color:#222}.box.on{background:#a5adb8}.divider{border-top:1px solid #38383c;margin:7px 0}.action{display:inline-flex;align-items:center;justify-content:center;min-height:24px;padding:0 7px;background:#2c2c30;border:1px solid #494950;color:#bdbdc5;font-size:11px;white-space:nowrap}.swatch{width:28px;height:23px;background:var(--color);border:1px solid #666;flex-shrink:0}.value-color{min-width:0;flex:1}.list{border:1px solid #414147;background:#1d1d20;margin:5px 0;color:#aeb0b8;font-size:11px}.list-item{min-height:25px;padding:5px 7px;display:flex;gap:8px;align-items:center}.list-item.selected{background:#35353c;color:#e0e0e4}.list-item .tail{margin-left:auto;color:#85858f}.toolbar{display:flex;gap:3px;margin:4px 0 7px}.toolbar .action{flex:1;padding:0 4px;font-size:10px}.details{border-top:1px solid #38383c;margin-top:8px;padding-top:5px}.details summary{cursor:pointer;color:#a0a0aa;font-size:11px;padding:3px 0;min-height:23px}.details[open] summary{margin-bottom:4px}.ramp{height:20px;background:linear-gradient(to right,#151515,#777,#f2f2f2);border:1px solid #4b4b51;position:relative;margin:8px 0 17px}.stop{position:absolute;top:21px;transform:translateX(-50%);width:7px;height:7px;border:1px solid #b8b8c0;background:#39393f}.stop:first-child{left:1%}.stop:nth-child(2){left:50%}.stop:nth-child(3){left:99%}.curve{display:block;width:100%;height:100px;background:#1c1c1f;border:1px solid #44444b;margin:6px 0}.wheel-row{display:flex;gap:12px;align-items:center;margin:8px 0}.wheel{position:relative;width:105px;height:105px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle,white,transparent 72%),conic-gradient(#d85f5f,#d8d867,#61bc75,#60bcc1,#7171c9,#c366bb,#d85f5f);border:1px solid #515157}.wheel:after{content:'+';position:absolute;left:47px;top:44px;color:#26262a;font-size:15px}.notes{padding:7px 10px 10px;border-top:1px solid #38383c;background:#212123}.notes label{display:block;font-size:10px;color:#8b8b94;margin:0 0 5px}.notes textarea{display:block;width:100%;min-height:52px;resize:vertical;padding:6px 7px;background:#1b1b1e;border:1px solid #38383f;line-height:1.5;font-size:12px}.notes textarea::placeholder{color:#62626c}.notes:focus-within textarea{border-color:#85858f}.notes .saved{float:right;color:#777782;font-size:10px}.storage-error{color:#d6b381;margin:0 0 12px;font-size:12px}.storage-error:empty{display:none}.table{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:4px;margin:3px 0}.table>span{text-align:center;color:#888893}.segments{display:flex;border:1px solid #48484e;height:25px;font-size:11px}.segments span{flex:1;text-align:center;padding:5px 2px;color:#82828c}.segments .active{color:#dedee4;background:#3a3a40}.range-track{height:15px;border:1px solid #44444b;background:linear-gradient(to right,#161616,#ddd);position:relative;margin:6px 0}.range-track:before,.range-track:after{content:'';position:absolute;top:-3px;bottom:-3px;width:2px;background:#c6c6ce}.range-track:before{left:18%}.range-track:after{right:18%}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:730px){header{padding:10px 14px;gap:8px;flex-wrap:wrap}header select{width:140px}header button{margin-left:auto}main{padding:16px 14px 40px}.grid{grid-template-columns:minmax(0,1fr);gap:16px}.panel{scroll-margin-top:105px}.intro{margin-bottom:18px}}
</style>
<header><h1>Node panels</h1><select id="jump" aria-label="Jump to node"><option value="">Jump to node…</option></select><button id="download">Download notes</button></header>
<main><p class="intro">Static parameter panels. Notes save locally in this browser.<br>Read, Write, and Blur are drafts. Approved studies: <a href="grade.prototype.html">Grade</a>, <a href="shuffle.prototype.html">Shuffle</a>, <a href="transform.prototype.html">Transform</a>.</p><p id="storage-error" class="storage-error" role="status"></p><div id="catalog"></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const menu=v=>`<div class="control menu"><span>${esc(v)}</span></div>`;
const scalar=(v='0.000',fill=35)=>`<div class="control slider" style="--fill:${fill}%"><span>${esc(v)}</span></div>`;
const num=v=>`<div class="control">${esc(v)}</div>`;
const text=v=>`<div class="control text">${esc(v)}</div>`;
const action=v=>`<span class="action">${esc(v)}</span>`;
const row=(label,control,extra='')=>`<div class="row"><span class="label">${esc(label)}</span>${control}<span class="affordance">${extra}</span></div>`;
const check=(label,on=false)=>`<span class="check"><span class="box ${on?'on':''}">${on?'✓':''}</span>${esc(label)}</span>`;
const checks=(...items)=>`<div class="checks">${items.join('')}</div>`;
const group=(labels,values)=>`<div class="${values.length===2?'pair':values.length===3?'triple':'quad'}">${values.map((v,i)=>`<div class="control"><span class="component ${labels[i].toLowerCase()}">${labels[i]}</span>${esc(v)}</div>`).join('')}</div>`;
const xy=(x=0,y=0)=>group(['X','Y'],[x,y]);
const rgb=(r='1.000',g=r,b=r)=>group(['R','G','B'],[r,g,b]);
const divider='<div class="divider"></div>';
const channels=(v='rgba')=>row('channels',menu(v));
const mask=()=>row('mask',`<div class="inline">${menu('none')}${check('Invert')}</div>`);
const mix=()=>row('mix',scalar('1.000',100));
const masked=()=>divider+mask()+mix();
const details=(title,body,open=false)=>`<details class="details" ${open?'open':''}><summary>${esc(title)}</summary>${body}</details>`;
const swatch=(hex,values='1.000')=>`<div class="inline"><span class="swatch" style="--color:${hex}"></span><div class="value-color">${scalar(values)}</div></div>`;
const curve=`<svg class="curve" viewBox="0 0 280 100" preserveAspectRatio="none" role="img" aria-label="Shadow and highlight range curves"><path d="M 0 25 H 280 M 0 50 H 280 M 0 75 H 280 M 70 0 V 100 M 140 0 V 100 M 210 0 V 100" stroke="#34343a" stroke-width=".7"/><path d="M 0 10 C 55 10 65 90 150 90 H 280" fill="none" stroke="#9299a7" stroke-width="1.5"/><path d="M 0 90 H 130 C 220 90 225 10 280 10" fill="none" stroke="#c5b8a3" stroke-width="1.5"/></svg>`;
const list=(items,selected=1)=>`<div class="list">${items.map((s,i)=>`<div class="list-item ${i===selected?'selected':''}">${s}</div>`).join('')}</div>`;
const layerTree=list(['⌄ &nbsp; Root <span class="tail">◉</span>','&nbsp;&nbsp; ◇ &nbsp; Bezier1 <span class="tail">over</span>']);
const nodes=[];
function add(category,name,body,draft=false){nodes.push({category,name,body,draft,id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')})}
add('Input and output','Read',
 row('source',`<div class="inline">${text('plate.####.exr')}${action('…')}</div>`)+row('range',group(['IN','OUT'],['1001','1100']))+row('frame mode',menu('start at'))+row('frame',num('1001'))+row('before / after',`<div class="pair">${menu('hold')}${menu('hold')}</div>`)+row('missing frames',menu('error'))+divider+row('color space',menu('ACEScg'))+row('alpha',menu('premultiplied'))+details('Proxy',row('source',`<div class="inline">${text('none')}${action('…')}</div>`))+checks(check('Raw data')),true);
add('Input and output','Write',
 row('destination',`<div class="inline">${text('comp.####.exr')}${action('…')}</div>`)+row('file type',menu('OpenEXR'))+channels()+row('data type',menu('16-bit half'))+row('compression',menu('ZIP (1 scanline)'))+row('color space',menu('ACEScg'))+divider+row('frame range',group(['IN','OUT'],['1001','1100']))+row('step',num('1'))+checks(check('Premultiplied',true),check('Create folders',true))+row('',action('Add to render queue')),true);
add('Input and output','Layer Contact Sheet',
 row('resolution',group(['W','H'],['3072','2048']))+row('grid',group(['R','C'],['3','4']))+checks(check('Auto grid',true),check('Center'))+row('row order',menu('bottom to top'))+row('column order',menu('left to right'))+row('gap',scalar('0',0))+checks(check('Show layer names')));
add('Layers and masks','Roto',
 channels('alpha')+checks(check('Clip to format',true),check('Premultiply'))+`<div class="toolbar">${action('Bézier')}${action('B-spline')}${action('Ellipse')}${action('Rectangle')}</div>`+layerTree+row('opacity',scalar('1.000',100))+row('feather',scalar('0.000',0))+row('falloff',scalar('1.000',50))+checks(check('Invert'))+details('Transform',row('translate',xy())+row('rotate',scalar('0.000',50))+row('scale',scalar('1.000'),'+')+row('center',xy()))+details('Lifetime and motion blur',row('lifetime',menu('all frames'))+row('motionblur',scalar('0',0))+row('shutter',scalar('0.500',25))));
add('Layers and masks','RotoPaint',
 channels()+`<div class="toolbar">${action('Brush')}${action('Clone')}${action('Reveal')}${action('Eraser')}</div>`+list(['⌄ &nbsp; Root','&nbsp;&nbsp; ∿ &nbsp; Stroke1 <span class="tail">over</span>'])+row('color',swatch('#dedede','1.000'),'+')+row('size',scalar('20.000',20))+row('hardness',scalar('0.800',80))+row('opacity',scalar('1.000',100))+row('lifetime',menu('single frame'))+row('frame',num('1001'))+details('Clone and reveal',row('source',menu('input'))+row('frame offset',num('0'))+row('translate',xy()))+details('Stroke',row('spacing',scalar('0.050',5))+row('write on',group(['IN','OUT'],['0.000','1.000']))+checks(check('Pressure → size',true),check('Pressure → opacity'))));
add('Layers and masks','Cryptomatte',
 row('crypto layer',menu('crypto_object'))+row('matte list',`<div class="inline">${text('sphere, cube')}${action('+')}${action('−')}</div>`)+list(['sphere','cube'],0)+row('output',menu('alpha'))+row('preview',menu('matte'))+checks(check('Preview',true),check('Remove crypto channels'))+details('Advanced',checks(check('Use wildcards'))+row('manifest',text('embedded'))));
add('Layers and masks','Keyer',
 row('operation',menu('luminance key'))+row('output',menu('rgba.alpha'))+row('range',group(['A','B','C','D'],['0.000','0.200','0.800','1.000']))+`<div class="range-track"></div>`+checks(check('Invert'))+masked());
add('Layers and masks','ChromaKeyer',
 row('view',menu('final result'))+row('screen color',swatch('#38764a','0.000'),'+')+row('screen gain',scalar('1.000',50))+row('screen balance',scalar('0.500',50))+details('Matte',row('chroma gain',scalar('0.000',0))+row('white point',scalar('1.000',100))+row('black point',scalar('0.000',0))+row('alpha bias',swatch('#808080','0.500'),'+')+row('inside mask',menu('ignore')),true)+details('Despill',checks(check('Custom bias'))+row('bias',swatch('#808080','0.500'),'+')+row('replace mode',menu('ignore'))+row('replace color',swatch('#ddd','1.000'),'+')+row('replace amount',scalar('1.000',100)))+checks(check('Premultiply',true)));
add('Combine and channels','Merge',
 row('operation',menu('over'))+row('A channels',menu('rgba'))+row('B channels',menu('rgba'))+row('output',menu('rgba'))+row('bounding box',menu('union'))+checks(check('Also merge other channels'))+masked());
add('Combine and channels','Copy',
 `<div class="table"><span>from A</span><span></span><span>to B</span></div>`+`<div class="table">${menu('rgba.alpha')}<span>→</span>${menu('rgba.alpha')}</div>`+`<div class="table">${menu('none')}<span>→</span>${menu('none')}</div>`+row('',action('+ channel pair'))+checks(check('Copy all channels'))+masked());
add('Combine and channels','Remove',row('operation',menu('remove'))+row('channels',menu('none'))+row('channels 2',menu('none'))+row('channels 3',menu('none'))+row('channels 4',menu('none')));
add('Combine and channels','Premult',channels('rgb')+row('multiply by',menu('rgba.alpha')));
add('Combine and channels','Unpremult',channels('rgb')+row('divide by',menu('rgba.alpha')));
add('Combine and channels','Dissolve',row('which',scalar('0.000',0))+masked());
add('Combine and channels','Switch',row('which',num('0')));
const correction=()=>row('saturation',scalar('1.000',50),'+')+row('contrast',scalar('1.000',50),'+')+row('gamma',scalar('1.000',50),'+')+row('gain',scalar('1.000',50),'+')+row('offset',scalar('0.000',50),'+');
add('Color','ColorCorrect',channels('rgb')+details('Master',correction(),true)+details('Shadows',correction())+details('Midtones',correction())+details('Highlights',correction())+details('Ranges',curve+checks(check('Test ranges')))+details('Processing',row('(un)premult by',menu('none'))+row('mix luminance',scalar('0.000',0)))+masked());
add('Color','Invert',channels('rgb')+masked());
add('Color','Clamp',channels()+row('minimum',scalar('0.000',0),'+')+row('maximum',scalar('1.000',100),'+')+checks(check('Clamp minimum',true),check('Clamp maximum',true))+masked());
add('Color','OCIOColorSpace',channels('rgb')+row('input',menu('ACEScg'))+row('output',menu('sRGB - Texture'))+checks(check('Swap input / output'))+row('(un)premult by',menu('none')));
add('Generate','Constant',row('format',menu('1920 × 1080 · HD'))+channels()+row('color',swatch('#ddd','1.000'),'+')+details('Color picker',`<div class="wheel-row"><div class="wheel" role="img" aria-label="Color wheel mockup"></div><div style="flex:1;min-width:0">${row('value',scalar('1.000',100))}${row('alpha',scalar('1.000',100))}</div></div>`+row('RGB',rgb())+row('hex',text('#FFFFFF'))));
add('Generate','Ramp',row('format',menu('1920 × 1080 · HD'))+row('type',menu('linear'))+row('point 0',xy('0','0'))+row('point 1',xy('1920','1080'))+`<div class="ramp"><span class="stop"></span><span class="stop"></span><span class="stop"></span></div>`+row('stop position',scalar('0.500',50))+row('color',swatch('#808080','0.500'),'+')+row('interpolation',menu('linear'))+checks(check('Invert')));
add('Generate','Noise',row('format',menu('1920 × 1080 · HD'))+row('type',menu('fBm'))+row('size',xy('100.000','100.000'))+row('z',scalar('0.000',0))+row('octaves',num('6'))+row('lacunarity',scalar('2.000',40))+row('gain',scalar('0.500',50))+row('gamma',scalar('1.000',50))+details('Transform',row('translate',xy())+row('rotate',scalar('0.000',50))+row('scale',scalar('1.000'),'+')));
add('Filter','Blur',channels('rgba')+row('size',scalar('0.000',0),'+')+row('filter','<div class="segments"><span class="active">Gaussian</span><span>Fast (Box)</span></div>')+checks(check('Crop to format',true))+masked(),true);
add('Filter','Erode (fast)',channels('rgba')+row('size',scalar('0.000',50),'+')+masked());
add('Filter','EdgeExtend',channels('rgb')+row('matte',menu('source alpha'))+checks(check('Source is premultiplied'))+row('erode',scalar('0.000',50))+row('detail amount',scalar('1.000',50))+divider+row('edge mask',menu('none'))+checks(check('Premultiply',true)));
add('Filter','Defocus',channels('all')+row('defocus',scalar('1.000',10))+row('aspect ratio',scalar('1.000',50))+row('scaling',scalar('1.000',50),'+')+row('quality',scalar('20',50))+row('method',menu('accelerated'))+masked());
add('Filter','Grain',row('preset',menu('other'))+row('seed',num('134'))+row('size',rgb('3.300','2.900','2.500'))+row('irregularity',rgb('0.600'))+row('intensity',rgb('0.416','0.460','0.850'))+row('black',scalar('0.000',0))+row('minimum',rgb('0.000'))+checks(check('Only through alpha',true),check('Invert alpha')));
add('Geometry and time','Reformat',row('type',menu('to format'))+row('format',menu('1920 × 1080 · HD'))+row('resize',menu('width'))+row('filter',menu('Cubic'))+checks(check('Center',true),check('Flip'),check('Flop'))+checks(check('Preserve bounding box')));
add('Geometry and time','Crop',row('box',group(['L','B'],['0','0']))+row('',group(['R','T'],['1920','1080']))+checks(check('Reformat'),check('Black outside',true)));
add('Geometry and time','CornerPin',details('To',row('1',xy('0','0'))+row('2',xy('1920','0'))+row('3',xy('1920','1080'))+row('4',xy('0','1080')),true)+details('From',row('1',xy('0','0'))+row('2',xy('1920','0'))+row('3',xy('1920','1080'))+row('4',xy('0','1080')))+checks(check('Invert'))+row('filter',menu('Cubic'))+checks(check('Black outside',true))+details('Motion blur',row('motionblur',scalar('0',0))+row('shutter',scalar('0.500',25))+row('shutter offset',menu('start'))));
add('Geometry and time','STMap',channels('rgba')+row('UV channels',menu('rgb'))+row('filter',menu('Cubic'))+masked());
add('Geometry and time','FrameHold',row('first frame',num('1001'))+row('increment',num('0')));
add('Geometry and time','TimeOffset',row('time offset',num('0')));
const storageKey='fold-node-panel-notes-v1';let notes={},storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))for(const node of nodes)if(typeof saved[node.id]==='string')notes[node.id]=saved[node.id]}catch{storageOK=false}
function storageWarning(){document.getElementById('storage-error').textContent=storageOK?'':'Browser storage is unavailable. Keep this page open and download your notes before closing it.'}
for(const category of new Set(nodes.map(n=>n.category))){
  const section=document.createElement('section'),heading=document.createElement('h2'),grid=document.createElement('div');heading.textContent=category;grid.className='grid';section.append(heading,grid);
  for(const node of nodes.filter(n=>n.category===category)){
    const panel=document.createElement('article');panel.className='panel';panel.id=node.id;panel.innerHTML=`<div class="title"><h3>${esc(node.name)}</h3>${node.draft?'<small>Draft</small>':''}</div><div class="body" aria-label="Static parameter mockup">${node.body}</div><div class="notes"><label for="note-${node.id}">Notes <span class="saved"></span></label><textarea id="note-${node.id}" aria-label="Notes for ${esc(node.name)}" placeholder="Add a note…"></textarea></div>`;
    const input=panel.querySelector('textarea'),status=panel.querySelector('.saved');input.value=notes[node.id]||'';status.textContent=input.value&&storageOK?'Saved':'';
    input.addEventListener('input',()=>{notes[node.id]=input.value;try{localStorage.setItem(storageKey,JSON.stringify(notes));storageOK=true;status.textContent=input.value?'Saved':''}catch{storageOK=false;status.textContent='Not saved'}storageWarning()});grid.append(panel);
    const option=document.createElement('option');option.value=node.id;option.textContent=node.name;document.getElementById('jump').append(option);
  }document.getElementById('catalog').append(section);
}
storageWarning();document.getElementById('jump').onchange=e=>{if(e.target.value){location.hash=e.target.value;document.getElementById(e.target.value).scrollIntoView({block:'start'})}};
document.getElementById('download').onclick=()=>{const entries=nodes.filter(n=>(notes[n.id]||'').trim());let content='# Fold node panel review\n\n'+new Date().toISOString().slice(0,10)+'\n\n'+(entries.length?entries.map(n=>'## '+n.name+'\n\n'+notes[n.id].trim()+'\n').join('\n'):'No notes yet.\n');let url=URL.createObjectURL(new Blob([content],{type:'text/markdown;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='fold-node-panel-notes.md';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
