<main><section class="viewer"><div class="viewbar"><span>Viewer</span><label><input id="handles" type="checkbox" checked> Handles</label><label><input id="animate" type="checkbox"> Animate</label></div><div class="stage"><canvas id="image" width="640" height="480"></canvas><svg id="overlay" viewBox="0 0 640 480" aria-label="Transform handles"></svg></div><div class="caption">Browser preview · filter kernels approximated</div></section><section class="panel"><div class="title"><strong>Transform</strong><small>01</small><button id="reset">Reset</button></div><div class="body"><div id="rows"></div><div class="checks"><label><input id="invert" type="checkbox"> Invert</label></div><div class="divider"></div><div class="row"><label class="name" for="filter">filter</label><select id="filter"><option>Impulse</option><option selected>Cubic</option><option>Keys</option><option>Simon</option><option>Rifman</option><option>Mitchell</option><option>Parzen</option><option>Notch</option><option>Lanczos4</option><option>Lanczos6</option><option>Sinc4</option></select></div><div class="checks"><label><input id="clamp" type="checkbox" disabled title="Browser preview has no filter overshoot; clamp has no effect here"> Clamp</label><label><input id="outside" type="checkbox" checked> Black outside</label></div><div id="motion"></div><div id="warning" class="warning" role="status"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);
const defaults=()=>({translate:[0,0],rotate:0,scale:[1,1],split:false,skewX:0,skewY:0,order:'XY',center:[320,240],invert:false,filter:'Cubic',outside:true,motionblur:0,shutter:.5,offset:'start',custom:0});
let state=defaults(),undo=[],redo=[],active=null,time=0,lastTime=0;
const copy=()=>JSON.parse(JSON.stringify(state)),format=n=>Number(n.toFixed(3)).toFixed(3);
function commit(before){if(JSON.stringify(before)!==JSON.stringify(state)){undo.push(before);redo=[]}}
function change(fn){let before=copy();fn();commit(before);render();draw()}
function restore(from,to){if(!from.length)return;to.push(copy());state=from.pop();render();draw()}
const ranges={rotate:[-180,180],scale:[0,3],skewX:[-45,45],skewY:[-45,45],motionblur:[0,16],shutter:[0,2],custom:[-1,1]};
function get(k){return k==='scale'?state.scale[0]:state[k]}
function set(k,n){if(!Number.isFinite(n))return;if(k==='motionblur')n=Math.round(Math.max(0,Math.min(32,n)));if(k==='shutter')n=Math.max(0,n);if(k==='scale')state.scale=[n,n];else state[k]=n;refresh();draw()}
function beginDrag(e,el,move){if(e.button!==0)return;let before=copy();el.setPointerCapture(e.pointerId);active={before,move};el.onpointermove=e=>{if(active)move(e)};el.onpointerup=()=>{if(active){let changed=JSON.stringify(before)!==JSON.stringify(state);commit(before);active=null;if(changed)render();draw()}};el.onpointercancel=cancel}
function cancel(){if(active){state=active.before;active=null;render();draw()}}
function field(k){let el=document.createElement('div');el.className='field';el.tabIndex=0;el.role='slider';el.dataset.k=k;el.setAttribute('aria-label',k);el.title='Drag · Shift: fine · Double-click: type';el.innerHTML='<span class="fill"></span><span class="mark"></span><span class="value"></span>';el.onpointerdown=e=>{if(e.target.tagName==='INPUT')return;el.focus();let last=e.clientX,n=get(k),range=ranges[k];beginDrag(e,el,e=>{n+=(e.clientX-last)*(range[1]-range[0])/240*(e.shiftKey?.1:1);last=e.clientX;set(k,n)})};el.ondblclick=()=>edit(el,k);el.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Enter'){e.preventDefault();edit(el,k)}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let before=copy();set(k,get(k)+(['ArrowRight','ArrowUp'].includes(e.key)?1:-1)*(k==='motionblur'?1:e.shiftKey?.01:.1));commit(before)}};return el}
function edit(el,k){let input=document.createElement('input');input.className='entry';input.value=format(get(k));input.setAttribute('aria-label','Enter '+k);el.append(input);input.focus();input.select();let done=false;function finish(save){if(done)return;done=true;if(save&&input.value.trim()!==''&&Number.isFinite(Number(input.value))){let before=copy();set(k,Number(input.value));commit(before)}input.remove();render();draw()}input.onblur=()=>finish(true);input.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')finish(true);if(e.key==='Escape')finish(false)}}
function xy(k){let group=document.createElement('div');group.className='xy';for(let c=0;c<2;c++){let label=document.createElement('label'),axis=document.createElement('span'),input=document.createElement('input');axis.textContent=['X','Y'][c];axis.title='Drag to adjust '+k+' '+axis.textContent;input.value=format(state[k][c]);input.dataset.xy=k;input.dataset.c=c;input.inputMode='decimal';input.setAttribute('aria-label',k+' '+axis.textContent);function save(){if(input.value.trim()!==''&&Number.isFinite(Number(input.value))){let before=copy();state[k][c]=Number(input.value);commit(before);draw()}input.value=format(state[k][c])}input.onblur=save;input.onkeydown=e=>{if(e.key==='Enter'){save();input.blur()}if(e.key==='Escape'){input.value=format(state[k][c]);input.blur()}};axis.onpointerdown=e=>{e.preventDefault();let last=e.clientX;beginDrag(e,axis,e=>{state[k][c]+=(e.clientX-last)*(k==='scale'?.01:1)*(e.shiftKey?.1:1);last=e.clientX;refresh();draw()})};label.append(axis,input);group.append(label)}return group}
function row(k,control,parent='rows'){let r=document.createElement('div');r.className='row';let label=document.createElement('button');label.className='name';label.textContent=({skewX:'skew X',skewY:'skew Y',order:'skew order',offset:'shutter offset',custom:'offset'})[k]||k;label.title='Double-click to reset';label.ondblclick=()=>change(()=>state[k]=defaults()[k]);r.append(label,control);$(parent).append(r);return r}
function menu(k,options){let select=document.createElement('select');select.setAttribute('aria-label',k);for(let name of options){let option=document.createElement('option');option.textContent=name;select.append(option)}select.value=state[k];select.onchange=()=>change(()=>state[k]=select.value);return select}
function render(){
  $('rows').replaceChildren();$('motion').replaceChildren();row('translate',xy('translate'));row('rotate',field('rotate'));
  let scale=row('scale',state.split?xy('scale'):field('scale')),toggle=document.createElement('button');toggle.className='expand';toggle.textContent=state.split?'−':'+';toggle.setAttribute('aria-label',state.split?'Combine scale XY':'Split scale XY');toggle.title=state.split?'Combine X/Y at their average':'Edit X/Y separately';toggle.onclick=()=>change(()=>{if(state.split){let average=(state.scale[0]+state.scale[1])/2;state.scale=[average,average]}state.split=!state.split});scale.append(toggle);
  row('skewX',field('skewX'));row('skewY',field('skewY'));row('order',menu('order',['XY','YX']));let center=row('center',xy('center')),button=document.createElement('button');button.className='expand';button.textContent='⌖';button.setAttribute('aria-label','Center on image');button.title='Center on image';button.onclick=()=>change(()=>state.center=[320,240]);center.append(button);
  row('motionblur',field('motionblur'),'motion');if(state.motionblur>0){row('shutter',field('shutter'),'motion');row('offset',menu('offset',['start','centred','end','custom']),'motion');if(state.offset==='custom')row('custom',field('custom'),'motion')}
  $('invert').checked=state.invert;$('outside').checked=state.outside;$('filter').value=state.filter;refresh();
}
function refresh(){document.querySelectorAll('.field').forEach(el=>{let k=el.dataset.k,n=get(k),range=ranges[k],p=Math.max(0,Math.min(100,(n-range[0])/(range[1]-range[0])*100));el.querySelector('.fill').style.width=p+'%';el.querySelector('.mark').style.left=p+'%';el.querySelector('.value').textContent=k==='motionblur'?n:format(n);el.setAttribute('aria-valuenow',n)});document.querySelectorAll('[data-xy]').forEach(el=>{if(document.activeElement!==el)el.value=format(state[el.dataset.xy][+el.dataset.c])})}
const canvas=$('image'),ctx=canvas.getContext('2d'),source=document.createElement('canvas');source.width=640;source.height=480;const sc=source.getContext('2d');let g=sc.createLinearGradient(0,0,640,400);g.addColorStop(0,'#23313b');g.addColorStop(1,'#99a5a6');sc.fillStyle=g;sc.fillRect(0,0,640,480);sc.fillStyle='#74736b';sc.fillRect(0,320,640,160);sc.fillStyle='#494c49';sc.beginPath();sc.ellipse(328,355,233,32,0,0,Math.PI*2);sc.fill();sc.fillStyle='#b57549';sc.fillRect(105,184,140,157);sc.fillStyle='#d99b6c';sc.beginPath();sc.moveTo(105,184);sc.lineTo(150,144);sc.lineTo(280,144);sc.lineTo(245,184);sc.fill();sc.fillStyle='#895233';sc.beginPath();sc.moveTo(245,184);sc.lineTo(280,144);sc.lineTo(280,306);sc.lineTo(245,341);sc.fill();g=sc.createRadialGradient(389,224,4,423,270,102);g.addColorStop(0,'#e2e4dc');g.addColorStop(.65,'#a2b4b4');g.addColorStop(1,'#455a64');sc.fillStyle=g;sc.beginPath();sc.arc(423,265,93,0,Math.PI*2);sc.fill();for(let i=0;i<12;i++){sc.fillStyle=`rgb(${i/11*255},${i/11*255},${i/11*255})`;sc.fillRect(32+i*48,418,48,25)}const original=sc.getImageData(0,0,640,480);
function matrix(t=0){let [cx,cy]=state.center,tx=state.translate[0],ty=state.translate[1],rotation=state.rotate;if($('animate').checked){tx+=Math.sin(t*1.5)*65;rotation+=Math.sin(t)*15}let m=new DOMMatrix().translate(tx,-ty).translate(cx,480-cy).rotate(-rotation);if(state.order==='XY')m=m.skewX(-state.skewX).skewY(-state.skewY);else m=m.skewY(-state.skewY).skewX(-state.skewX);m=m.scale(state.scale[0],state.scale[1]).translate(-cx,-(480-cy));return state.invert?m.inverse():m}
const composite=document.createElement('canvas');composite.width=640;composite.height=480;const cc=composite.getContext('2d');
function drawImage(m,alpha){cc.save();cc.globalAlpha=alpha;cc.setTransform(m);cc.imageSmoothingEnabled=state.filter!=='Impulse';cc.imageSmoothingQuality='high';cc.drawImage(source,0,0);if(!state.outside){const extent=8192;cc.drawImage(source,0,0,1,480,-extent,0,extent,480);cc.drawImage(source,639,0,1,480,640,0,extent,480);cc.drawImage(source,0,0,640,1,0,-extent,640,extent);cc.drawImage(source,0,479,640,1,0,480,640,extent);for(let x of [0,639])for(let y of [0,479])cc.drawImage(source,x,y,1,1,x===0?-extent:640,y===0?-extent:480,extent,extent)}cc.restore()}
function draw(){
  const m=matrix(time),valid=Number.isFinite(m.a)&&Math.abs(m.a*m.d-m.b*m.c)>1e-10;
  $('warning').textContent=!valid?(state.invert?'Scale is zero. Cannot invert the transform.':'Scale is zero. The image has no area.'):'';
  ctx.setTransform(1,0,0,1,0,0);for(let y=0;y<480;y+=12)for(let x=0;x<640;x+=12){ctx.fillStyle=((x+y)/12)%2?'#373737':'#2c2c2c';ctx.fillRect(x,y,12,12)}cc.clearRect(0,0,640,480);
  if(valid){const samples=$('animate').checked?Math.max(1,state.motionblur):1;cc.globalCompositeOperation='lighter';for(let i=0;i<samples;i++){let offset=state.offset==='centred'?-state.shutter/2:state.offset==='end'?-state.shutter:state.offset==='custom'?state.custom:0;let dt=samples>1?(offset+(i+.5)/samples*state.shutter)/24:0;drawImage(matrix(time+dt),1/samples)}cc.globalCompositeOperation='source-over';ctx.drawImage(composite,0,0)}drawHandles(m,valid);
}
function drawHandles(m,valid){let svg=$('overlay');svg.replaceChildren();if(!$('handles').checked||!valid||state.invert||$('animate').checked)return;let pivot=m.transformPoint(new DOMPoint(state.center[0],480-state.center[1]));
  let group=document.createElementNS('http://www.w3.org/2000/svg','g');group.setAttribute('transform',`translate(${pivot.x} ${pivot.y})`);group.setAttribute('stroke','#bfc3c8');group.setAttribute('stroke-width','1');group.innerHTML=`<circle r="42" fill="none" stroke-opacity=".7"/><circle r="42" fill="none" stroke="transparent" stroke-width="12" data-handle="rotate"><title>Rotate · Shift: snap to 15°</title></circle><path d="M -14 0 H 70 M 0 14 V -70" fill="none" stroke-opacity=".8"/><rect x="-5" y="-5" width="10" height="10" fill="#242426" data-handle="translate"><title>Move · Alt: move center</title></rect><rect x="66" y="-4" width="8" height="8" fill="#242426" data-handle="scaleX"><title>Scale X</title></rect><rect x="-4" y="-74" width="8" height="8" fill="#242426" data-handle="scaleY"><title>Scale Y</title></rect><path d="M 42 -55 H 55 V -42" fill="none"/><rect x="48" y="-62" width="14" height="14" fill="transparent" stroke="none" data-handle="scale"><title>Scale uniformly</title></rect>`;
  svg.append(group);group.querySelectorAll('[data-handle]').forEach(el=>el.onpointerdown=e=>startHandle(e,el.dataset.handle,pivot));
}
function point(e){let r=$('overlay').getBoundingClientRect();return {x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*480/r.height}}
function startHandle(e,kind,pivot){if(state.invert||$('animate').checked)return;e.preventDefault();let start=point(e),before=copy(),theta=Math.atan2(start.y-pivot.y,start.x-pivot.x),distance=Math.max(1,Math.hypot(start.x-pivot.x,start.y-pivot.y));beginDrag(e,$('overlay'),e=>{let now=point(e),dx=now.x-start.x,dy=now.y-start.y;if(kind==='translate'){if(e.altKey){state.center=[before.center[0]+dx,before.center[1]-dy];let linear=matrix(time),compX=linear.a*dx+linear.c*dy-dx,compY=linear.b*dx+linear.d*dy-dy;state.translate=[before.translate[0]+compX,before.translate[1]-compY]}else state.translate=[before.translate[0]+dx,before.translate[1]-dy]}if(kind==='rotate'){let delta=Math.atan2(now.y-pivot.y,now.x-pivot.x)-theta;delta=Math.atan2(Math.sin(delta),Math.cos(delta));state.rotate=before.rotate-delta*180/Math.PI;if(e.shiftKey)state.rotate=Math.round(state.rotate/15)*15}if(kind==='scale'){let ratio=Math.hypot(now.x-pivot.x,now.y-pivot.y)/distance;state.scale=before.scale.map(v=>v*ratio)}if(kind==='scaleX'){state.scale[0]=before.scale[0]*(1+dx/70);state.split=true}if(kind==='scaleY'){state.scale[1]=before.scale[1]*(1-dy/70);state.split=true}refresh();draw()})}
$('reset').onclick=()=>change(()=>state=defaults());for(let [id,k] of [['invert','invert'],['outside','outside'],['filter','filter']])$(id).onchange=()=>change(()=>state[k]=$(id).type==='checkbox'?$(id).checked:$(id).value);
$('handles').onchange=draw;$('animate').onchange=()=>{time=0;lastTime=0;draw()};
document.onkeydown=e=>{if(e.key==='Escape'){cancel();return}if(e.target.matches('input,select'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?restore(redo,undo):restore(undo,redo)}};
function tick(now){if($('animate').checked){if(lastTime)time+=(now-lastTime)/1000;draw()}lastTime=now;requestAnimationFrame(tick)}
render();draw();requestAnimationFrame(tick);
</script></html>
