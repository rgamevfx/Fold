<!doctype html>
<!-- Throwaway Shuffle control study. Open directly, or serve alongside grade.prototype.html.
     Reference: https://learn.foundry.com/nuke/16.1/content/comp_environment/channels/swapping_channels.html
     Nuke's socket layout, using the accepted compact Grade styling. Generated inputs; no project writes. -->
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fold · Shuffle</title>
<style>
:root{color-scheme:dark;font:12px Arial,sans-serif;color:#c9c9cb;background:#19191b}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit;border-radius:0}button,select,input{background:#1c1c1f;border:1px solid #444449;min-height:25px}button{cursor:pointer}button:hover{background:#353539}button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid #b5c7dd;outline-offset:2px}main{display:grid;grid-template-columns:minmax(300px,1fr) 410px;max-width:1280px;margin:58px auto;padding:0 24px;gap:24px;align-items:start}.viewer{min-width:0}.viewbar{height:32px;display:flex;align-items:center;gap:10px;color:#94949b;font-size:11px}.viewbar select{font-size:11px;min-height:22px}.viewbar #display{margin-left:auto}.viewer canvas{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#111}.caption{color:#77777f;font-size:11px;margin-top:10px}.panel{background:#242426;border:1px solid #3a3a3e;min-width:0}.title{height:31px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #3a3a3e;gap:9px}.title strong{font-weight:500;color:#e2e2e4}.title small{font-size:10px;color:#77777e}.title button{margin-left:auto;background:none;border:0;color:#929298;font-size:11px}.body{padding:8px 10px 10px}.headings{display:flex;justify-content:space-between;color:#929299;font-size:11px;padding:0 0 7px}.headings span{width:39%}.graph{position:relative;touch-action:none}.pair{display:grid;grid-template-columns:39% 22% 39%;margin-bottom:10px}.pair:last-of-type{margin-bottom:0}.side{min-width:0}.out{grid-column:3}.selectors{display:flex;gap:4px;height:25px;margin-bottom:5px}.selectors select{min-width:0;flex:1;width:0;padding:0 3px;font-size:11px}.selectors .branch{flex:0 0 39px}.selectors .match{flex:0 0 20px;min-height:25px;font-size:12px;color:#919199;border:0;background:none;padding:0}.channels{display:flex;flex-direction:column}.channel{height:24px;display:flex;align-items:center;position:relative;gap:4px}.in .channel{justify-content:flex-end}.channel-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#babac1}.port{position:relative;min-height:22px;width:18px;flex:0 0 18px;border:0;padding:0;background:none!important;touch-action:none}.port:before{content:'';position:absolute;left:5px;top:7px;width:8px;height:8px;border-radius:50%;border:1px solid var(--channel);background:var(--channel)}.port:hover:before,.port.pending:before{outline:1px solid #dedee3;outline-offset:3px}.port.pending:before{background:#242426}.constants{display:flex;gap:1px}.constant{width:16px;min-height:18px;height:18px;padding:0;background:transparent;border:1px solid transparent;color:#7c7c84;font:10px monospace}.constant:hover{border-color:#6a6a72}.constant[aria-pressed=true]{border-color:#9999a2;color:#e2e2e6;background:#353539}.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.wires path{fill:none;stroke-width:1.2;opacity:.8}.new-layer{position:absolute;left:0;right:0;top:0;width:100%;height:25px;padding:0 5px;z-index:3}.selectors{position:relative}.disabled .channel-name{opacity:.4}@media(max-width:760px){main{grid-template-columns:minmax(0,1fr);max-width:480px;margin-top:18px;padding:0 14px;gap:18px}.viewer canvas{max-height:210px}.caption{display:none}}@media(min-width:761px) and (max-width:980px){main{grid-template-columns:minmax(240px,1fr) 360px;gap:16px;padding:0 16px}}
</style>
<main>
<section class="viewer"><div class="viewbar"><span>Viewer</span><select id="view" aria-label="Viewer layer"></select><select id="display" aria-label="Viewer channels"><option value="rgb">RGB</option><option value="alpha">Alpha</option></select></div><canvas id="image" width="640" height="480"></canvas><div class="caption">Generated inputs · display-space preview</div></section>
<section class="panel"><div class="title"><strong>Shuffle</strong><small>01</small><button id="reset" title="Reset Shuffle">Reset</button></div><div class="body"><div class="headings"><span>Input</span><span>Output</span></div><div id="graph" class="graph"><svg id="wires" class="wires" aria-hidden="true"></svg><div id="pairs"></div></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id),names=['red','green','blue','alpha'],colors=['#bb7777','#79a886','#7d94be','#b2b2b8'],layers=['rgba','diffuse','specular','depth'];
const defaults=()=>({inputs:[{branch:'B',layer:'rgba'},{branch:'B',layer:'none'}],outputs:['rgba','none'],maps:[[0,1,2,3].map(c=>({slot:0,c})),[0,1,2,3].map(c=>({slot:1,c}))],custom:[]});
let state=defaults(),undo=[],redo=[],pending=null,drag=null;
const copy=()=>JSON.parse(JSON.stringify(state));
function mutate(fn){const before=copy();fn();if(JSON.stringify(before)!==JSON.stringify(state)){undo.push(before);redo=[]}pending=null;render();draw()}
function restore(from,to){if(!from.length)return;to.push(copy());state=from.pop();pending=null;render();draw()}
function select(options,value,label,change){const el=document.createElement('select');el.setAttribute('aria-label',label);for(const name of options){let option=document.createElement('option');option.value=name;option.textContent=name;el.append(option)}el.value=value;el.onchange=()=>change(el.value,el);return el}
function port(side,slot,c){let b=document.createElement('button');b.className='port';b.style.setProperty('--channel',colors[c]);b.dataset.side=side;b.dataset.slot=slot;b.dataset.c=c;b.setAttribute('aria-label',(side==='in'?'Input ':'Output ')+(slot+1)+' '+names[c]);b.title=side==='in'?'Drag to an output, or select then click an output':'Drag to an input, or select then click an input';
  b.onpointerdown=e=>{if(e.button!==0)return;drag={side,slot,c,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false};b.focus();e.preventDefault()};
  b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose({side,slot,c},e)}if(e.key==='Delete'&&side==='out'){e.preventDefault();assignConstant(slot,c,0,e)}};
  return b;
}
function choose(point,mods={}){if(pending&&pending.side!==point.side){connect(pending,point,mods);pending=null}else pending=point;paintWires()}
function connect(a,b,mods={}){let input=a.side==='in'?a:b,output=a.side==='out'?a:b;if(input.side===output.side)return;mutate(()=>{let map=state.maps[output.slot];if(mods.altKey)for(let c=0;c<4;c++)map[c]={slot:input.slot,c:input.c};else if(mods.ctrlKey||mods.metaKey){const offset=output.c-input.c;for(let c=0;c<4;c++)if((mods.shiftKey?c<=output.c:c>=output.c)&&c-offset>=0&&c-offset<4)map[c]={slot:input.slot,c:c-offset}}else map[output.c]={slot:input.slot,c:input.c}})}
function assignConstant(slot,c,value,mods={}){mutate(()=>{if(mods.ctrlKey||mods.metaKey)state.maps[slot]=names.map(()=>({constant:value}));else state.maps[slot][c]={constant:value}})}
function render(){
  $('pairs').replaceChildren();
  for(let slot=0;slot<2;slot++){
    let pair=document.createElement('div');pair.className='pair';
    for(const side of ['in','out']){
      let group=document.createElement('div');group.className='side '+side;let selectors=document.createElement('div');selectors.className='selectors';
      if(side==='in'){
        let branch=select(['B','A'],state.inputs[slot].branch,'Input '+(slot+1)+' source',value=>mutate(()=>state.inputs[slot].branch=value));branch.className='branch';selectors.append(branch);
        selectors.append(select(['none',...layers],state.inputs[slot].layer,'Input '+(slot+1)+' layer',value=>mutate(()=>{state.inputs[slot].layer=value})));
      }else{
        selectors.append(select(['none',...layers,...state.custom,'new…'],state.outputs[slot],'Output '+(slot+1)+' layer',(value,el)=>{
          if(value==='new…'){el.value=state.outputs[slot];let input=document.createElement('input');input.className='new-layer';input.placeholder='Layer name';input.setAttribute('aria-label','New output layer');selectors.append(input);input.focus();input.onkeydown=e=>{if(e.key==='Escape')input.remove();if(e.key==='Enter'){let name=input.value.trim();if(!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(name)||name==='none'){input.setCustomValidity('Use letters, numbers, and underscores. Start with a letter.');input.reportValidity();return}mutate(()=>{if(![...layers,...state.custom].includes(name))state.custom.push(name);setOutput(slot,name)})}};input.onblur=()=>input.remove();return}
          mutate(()=>setOutput(slot,value));
        }));
        let match=document.createElement('button');match.className='match';match.textContent='=';match.setAttribute('aria-label','Connect output '+(slot+1)+' by channel order');match.title='Connect matching channels';match.onclick=()=>mutate(()=>{let source=state.inputs[slot].layer!=='none'?slot:0;state.maps[slot]=names.map((_,c)=>({slot:source,c}))});selectors.append(match);
      }
      group.append(selectors);let active=side==='in'?state.inputs[slot].layer!=='none':state.outputs[slot]!=='none';
      if(active){let channels=document.createElement('div');channels.className='channels';for(let c=0;c<4;c++){let row=document.createElement('div');row.className='channel';let label=document.createElement('span');label.className='channel-name';label.textContent=names[c];let socket=port(side,slot,c);if(side==='in')row.append(label,socket);else{let constants=document.createElement('div');constants.className='constants';for(let value=0;value<2;value++){let button=document.createElement('button');button.className='constant';button.textContent=value;button.setAttribute('aria-label','Output '+(slot+1)+' '+names[c]+' '+(value?'white':'black'));button.setAttribute('aria-pressed',state.maps[slot][c].constant===value);button.title=(value?'White (1)':'Black (0)')+' · Ctrl/Cmd: all channels';button.onclick=e=>assignConstant(slot,c,value,e);constants.append(button)}row.append(socket,constants,label)}channels.append(row)}group.append(channels)}pair.append(group);
    }$('pairs').append(pair);
  }
  let current=$('view').value;$('view').replaceChildren();for(let layer of new Set(['rgba',...state.outputs.filter(x=>x!=='none')])){let opt=document.createElement('option');opt.value=layer;opt.textContent=layer;$('view').append(opt)}$('view').value=[...$('view').options].some(o=>o.value===current)?current:state.outputs.find(x=>x!=='none')||'rgba';paintWires();
}
function setOutput(slot,value){if(value!=='none'&&state.outputs[1-slot]===value)state.outputs[1-slot]='none';state.outputs[slot]=value}
function socket(point){return document.querySelector('.port[data-side="'+point.side+'"][data-slot="'+point.slot+'"][data-c="'+point.c+'"]')}
function center(el){let box=el.getBoundingClientRect(),root=$('graph').getBoundingClientRect();return {x:box.left+box.width/2-root.left,y:box.top+box.height/2-root.top}}
function wire(a,b,color,dashed=false){let path=document.createElementNS('http://www.w3.org/2000/svg','path'),distance=Math.max(20,Math.abs(b.x-a.x)*.42);path.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+distance} ${a.y}, ${b.x-distance} ${b.y}, ${b.x} ${b.y}`);path.setAttribute('stroke',color);if(dashed)path.setAttribute('stroke-dasharray','3 3');$('wires').append(path)}
function paintWires(){
  $('wires').replaceChildren();document.querySelectorAll('.port').forEach(el=>el.classList.remove('pending'));
  state.maps.forEach((mapping,slot)=>{if(state.outputs[slot]==='none')return;mapping.forEach((from,c)=>{let end=socket({side:'out',slot,c});if(!end||from.constant!==undefined)return;let start=socket({side:'in',slot:from.slot,c:from.c});if(start)wire(center(start),center(end),colors[from.c]);else{let p=center(end);wire({x:p.x-22,y:p.y},p,'#77777e',true);end.title='Source layer is none; channel is black'}})});
  if(pending)socket(pending)?.classList.add('pending');
  if(drag&&drag.moved){let start=socket(drag);if(start){let root=$('graph').getBoundingClientRect(),cursor={x:drag.x-root.left,y:drag.y-root.top};drag.side==='in'?wire(center(start),cursor,'#dddde2'):wire(cursor,center(start),'#dddde2')}}
}
document.addEventListener('pointermove',e=>{if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;drag.moved ||= Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>3;paintWires()});
document.addEventListener('pointerup',e=>{if(!drag)return;let start=drag;drag=null;let hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.port');if(hit){let target={side:hit.dataset.side,slot:+hit.dataset.slot,c:+hit.dataset.c};if(target.side!==start.side){connect(start,target,e);pending=null}else if(!start.moved)choose(start,e)}paintWires()});
document.addEventListener('pointercancel',()=>{drag=null;paintWires()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){drag=null;pending=null;paintWires()}if(e.target.matches('input,select'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?restore(redo,undo):restore(undo,redo)}});
new ResizeObserver(paintWires).observe($('graph'));
const canvas=$('image'),ctx=canvas.getContext('2d'),source=document.createElement('canvas');source.width=640;source.height=480;const sc=source.getContext('2d');let g=sc.createLinearGradient(0,0,640,400);g.addColorStop(0,'#23313b');g.addColorStop(1,'#99a5a6');sc.fillStyle=g;sc.fillRect(0,0,640,480);sc.fillStyle='#74736b';sc.fillRect(0,320,640,160);sc.fillStyle='#494c49';sc.beginPath();sc.ellipse(328,355,233,32,0,0,Math.PI*2);sc.fill();sc.fillStyle='#b57549';sc.fillRect(105,184,140,157);sc.fillStyle='#d99b6c';sc.beginPath();sc.moveTo(105,184);sc.lineTo(150,144);sc.lineTo(280,144);sc.lineTo(245,184);sc.fill();sc.fillStyle='#895233';sc.beginPath();sc.moveTo(245,184);sc.lineTo(280,144);sc.lineTo(280,306);sc.lineTo(245,341);sc.fill();g=sc.createRadialGradient(389,224,4,423,270,102);g.addColorStop(0,'#e2e4dc');g.addColorStop(.65,'#a2b4b4');g.addColorStop(1,'#455a64');sc.fillStyle=g;sc.beginPath();sc.arc(423,265,93,0,Math.PI*2);sc.fill();for(let i=0;i<12;i++){sc.fillStyle=`rgb(${i/11*255},${i/11*255},${i/11*255})`;sc.fillRect(32+i*48,418,48,25)}const original=sc.getImageData(0,0,640,480);
// Small generated multilayer inputs keep routing changes visible without external files.
const buffers={};
for(const branch of ['B','A']){buffers[branch]={};for(const layer of layers){let data=new Float32Array(640*480*4);for(let i=0;i<data.length;i+=4){let p=i/4,x=p%640,y=Math.floor(p/640),mask=Math.max(0,Math.min(1,(160-Math.hypot(x-320,y-240))/45));for(let c=0;c<4;c++){let v=original.data[i+c]/255;if(branch==='A')v=c===3?mask:[x/639,y/479,1-x/639][c];if(layer==='diffuse'&&c<3)v*=.65;if(layer==='specular'&&c<3)v=Math.pow(v,5);if(layer==='depth')v=c===3?1:y/479;data[i+c]=v}}buffers[branch][layer]=data}}
function sample(mapping,i){if(mapping.constant!==undefined)return mapping.constant;let input=state.inputs[mapping.slot];return buffers[input.branch][input.layer]?.[i+mapping.c]??0}
function draw(){let slot=state.outputs.indexOf($('view').value),alphaOnly=$('display').value==='alpha',out=ctx.createImageData(640,480);for(let i=0;i<out.data.length;i+=4){let rgba=slot<0?Array.from(original.data.slice(i,i+4),v=>v/255):state.maps[slot].map(m=>sample(m,i)),p=i/4,bg=((Math.floor(p%640/12)+Math.floor(p/640/12))%2)?55:44;for(let c=0;c<3;c++)out.data[i+c]=alphaOnly?rgba[3]*255:rgba[c]*255*rgba[3]+bg*(1-rgba[3]);out.data[i+3]=255}ctx.putImageData(out,0,0)}
$('reset').onclick=()=>mutate(()=>state=defaults());$('view').onchange=draw;$('display').onchange=draw;
render();draw();
</script></html>
