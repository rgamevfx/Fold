[package]
name = "fold-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "fold-cli"

[features]
default = []
native-probe = ["desktop", "fold-ui/native-probe"]
gpu = ["fold-render/gpu", "fold-platform/gpu", "fold-motion-context/gpu"]
spatial = ["gpu", "fold-render/spatial"]
native-video = ["gpu", "fold-render/native-video"]
desktop = ["native-video", "spatial", "dep:rfd", "dep:fold-ui", "dep:cpal", "dep:rtrb", "fold-timeline/ui", "fold-compositor/ui", "fold-composition/ui", "fold-motion-context/ui", "fold-three-d/ui"]

[dependencies]
fold-animation.workspace = true
fold-graph.workspace = true
schemars.workspace = true
sha2 = "0.10"
fold-motion-canvas.workspace = true
fold-motion-context.workspace = true
fold-three-d.workspace = true
fold-composition.workspace = true
pollster = "0.4"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
fold-foundation.workspace = true
fold-color.workspace = true
tempfile.workspace = true
fold-project.workspace = true
fold-media.workspace = true
fold-render.workspace = true
fold-platform.workspace = true
fold-timeline.workspace = true
fold-compositor.workspace = true
fold-ui = { workspace = true, optional = true }
cpal = { version = "0.15.3", optional = true }
rtrb = { version = "0.3", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[[bin]]
name = "fold-cli"
path = "src/bin/cli.rs"

[[example]]
name = "exr_profile"
required-features = ["gpu"]

[[example]]
name = "render_profile"
required-features = ["gpu"]

[[example]]
name = "project_profile"
required-features = ["gpu"]

[[bin]]
name = "fold-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[lints]
workspace = true

[dev-dependencies]
exr = { version = "=1.74.2", default-features = false }

[build-dependencies]
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["net", "process"] }

[[bin]]
name = "fold-runtime-check"
path = "src/bin/runtime_check.rs"
required-features = ["gpu"]
