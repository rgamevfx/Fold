[package]
name = "fold-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "fold-cli"

[features]
default = []
native-probe = ["desktop", "fold-ui/native-probe"]
gpu = ["fold-render/gpu", "fold-platform/gpu"]
native-video = ["gpu", "fold-render/native-video"]
desktop = ["native-video", "dep:rfd", "dep:fold-ui", "dep:cpal", "dep:rtrb", "fold-timeline/ui", "fold-compositor/ui", "fold-motion/ui"]

[dependencies]
schemars.workspace = true
sha2 = "0.10"
png = "0.17.16"
base64 = "0.22"
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pollster = "0.4"
serde.workspace = true
serde_json.workspace = true
fold-foundation.workspace = true
fold-color.workspace = true
tempfile.workspace = true
fold-project.workspace = true
fold-media.workspace = true
fold-render.workspace = true
fold-platform.workspace = true
fold-timeline.workspace = true
fold-compositor.workspace = true
fold-motion.workspace = true
fold-ui = { workspace = true, optional = true }
cpal = { version = "0.15.3", optional = true }
rtrb = { version = "0.3", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }

[[bin]]
name = "fold-cli"
path = "src/bin/cli.rs"

[[example]]
name = "render_profile"
required-features = ["gpu"]

[[example]]
name = "motion_profile"
required-features = ["gpu"]

[[bin]]
name = "fold-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[lints]
workspace = true

[dev-dependencies]
exr = { version = "=1.74.2", default-features = false }

[build-dependencies]
sha2 = "0.10"
