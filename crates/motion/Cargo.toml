[package]
name = "fold-motion"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
ui = ["dep:fold-ui"]

[dependencies]
fold-composition.workspace = true
schemars.workspace = true
fold-animation.workspace = true
serde.workspace = true
serde_json.workspace = true
fold-foundation.workspace = true
fold-project.workspace = true
fold-media.workspace = true
fold-render.workspace = true
fold-platform.workspace = true
fold-ui = { workspace = true, optional = true }
rustybuzz = "0.20"
unicode-bidi = "0.3"
wasmtime = { version = "43.0", default-features = false, features = ["cranelift", "runtime", "std", "pooling-allocator"] }
syn = { version = "2", features = ["full", "visit"] }
tempfile.workspace = true

[lints]
workspace = true

[dev-dependencies]
pollster = "0.4"
