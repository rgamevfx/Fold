[package]
name = "fold-gpu-sharing"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["consumer"]
consumer = ["dep:wgpu"]

[dependencies]
fold-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { version = "1", features = ["net"] }
ash = "0.38"
wgpu = { version = "27", optional = true, default-features = false, features = ["std", "vulkan"] }

[dev-dependencies]
log = "0.4"
fold-media.workspace = true
pollster = "0.4"
half = "2"
tempfile.workspace = true

# Vulkan FFI is confined to the module explicitly allowed in lib.rs.
[lints.rust]
unsafe_code = "deny"
