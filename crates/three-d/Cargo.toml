[package]
name = "fold-three-d"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
gpu = ["fold-render/spatial", "dep:pollster"]
ui = ["dep:fold-ui"]

[dependencies]
fold-foundation.workspace = true
fold-graph.workspace = true
fold-project.workspace = true
fold-render.workspace = true
fold-media.workspace = true
fold-platform.workspace = true
fold-animation.workspace = true
fold-ui = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
schemars.workspace = true
pollster = { version = "0.4", optional = true }

[[example]]
name = "render_scene"
required-features = ["gpu"]

[lints]
workspace = true
