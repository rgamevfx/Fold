[package]
name = "fold-media"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
native-video = ["dep:fold-native-video"]

[dependencies]
fold-native-video = { workspace = true, optional = true }
fold-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2 = "0.10"
tiff = "=0.11.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
exr = { version = "=1.74.2", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
fold-native-video = { workspace = true, features = ["gpu"] }
wgpu = "27"
pollster = "0.4"

[lints]
workspace = true
