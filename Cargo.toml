[workspace]
resolver = "3"
members = [
    "crates/foundation",
    "crates/animation",
    "crates/color",
    "crates/native-video",
    "crates/project",
    "crates/media",
    "crates/render",
    "crates/platform",
    "crates/ui",
    "crates/timeline",
    "crates/compositor",
    "crates/motion",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
fold-animation = { path = "crates/animation" }
fold-foundation = { path = "crates/foundation" }
fold-color = { path = "crates/color" }
fold-native-video = { path = "crates/native-video" }
fold-project = { path = "crates/project" }
fold-media = { path = "crates/media" }
fold-render = { path = "crates/render" }
fold-platform = { path = "crates/platform" }
fold-ui = { path = "crates/ui" }
fold-timeline = { path = "crates/timeline" }
fold-compositor = { path = "crates/compositor" }
fold-motion = { path = "crates/motion" }

[workspace.lints.rust]
unsafe_code = "forbid"
