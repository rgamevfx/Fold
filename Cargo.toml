[workspace]
resolver = "3"
members = [
    "crates/foundation",
    "crates/animation",
    "crates/graph",
    "crates/color",
    "crates/native-video",
    "crates/project",
    "crates/media",
    "crates/render",
    "crates/gpu-sharing",
    "crates/platform",
    "crates/ui",
    "crates/timeline",
    "crates/compositor",
    "crates/composition",
    "crates/motion-canvas",
    "crates/motion-context",
    "crates/three-d",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
fold-graph = { path = "crates/graph" }
fold-animation = { path = "crates/animation" }
fold-foundation = { path = "crates/foundation" }
fold-color = { path = "crates/color" }
fold-native-video = { path = "crates/native-video" }
fold-project = { path = "crates/project" }
fold-media = { path = "crates/media" }
fold-render = { path = "crates/render" }
fold-gpu-sharing = { path = "crates/gpu-sharing" }
fold-platform = { path = "crates/platform" }
fold-ui = { path = "crates/ui" }
fold-timeline = { path = "crates/timeline" }
fold-compositor = { path = "crates/compositor" }
fold-composition = { path = "crates/composition" }
fold-motion-canvas = { path = "crates/motion-canvas" }
fold-motion-context = { path = "crates/motion-context" }
fold-three-d = { path = "crates/three-d" }

[workspace.lints.rust]
unsafe_code = "forbid"
